  <text x="27" y="141" font-size="3.9" fill="#2C2C2A">Water-soluble, biodegradable sheet</text>
  <text x="27" y="148" font-size="3.9" fill="#2C2C2A">No sulphates &#183; no phosphates &#183; no dyes</text>
