  <text x="146" y="236" font-size="4" font-weight="700" fill="#2C2C2A">Before this goes to print</text>
  <text x="146" y="242" font-size="3.4" fill="#5F5E5A">1. Supply vector logo (AI/EPS/SVG)</text>
  <text x="146" y="247" font-size="3.4" fill="#5F5E5A">2. Confirm foil vs. flat-print gold</text>
