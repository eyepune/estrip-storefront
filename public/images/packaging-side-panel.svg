<svg viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f0066"/>
      <stop offset="100%" stop-color="#0096cc"/>
    </linearGradient>
  </defs>

  <!-- Background Wrap -->
  <rect width="500" height="150" fill="url(#bgGrad)" opacity="0.2"/>
  <rect width="500" height="150" fill="#0f0066" opacity="0.8"/>

  <!-- Top highlight -->
  <rect width="500" height="2" fill="#e040a0" opacity="0.5"/>

  <!-- Left Side: 15 Sheets / 30 Loads -->
  <g transform="translate(100, 50)">
    <text x="0" y="0" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">15</text>
    <text x="0" y="18" font-size="10" font-weight="800" fill="#e040a0" text-anchor="middle" letter-spacing="1">SHEETS</text>
  </g>

  <line x1="150" y1="30" x2="150" y2="70" stroke="#0096cc" stroke-width="2"/>

  <g transform="translate(200, 50)">
    <text x="0" y="0" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">30</text>
    <text x="0" y="18" font-size="10" font-weight="800" fill="#e040a0" text-anchor="middle" letter-spacing="1">LOADS</text>
  </g>

  <!-- Right Side: Fragrance Tag -->
  <g transform="translate(360, 50)">
    <rect x="-60" y="-20" width="120" height="30" rx="15" fill="#0096cc" opacity="0.2"/>
    <text x="0" y="0" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle" fill="#ffffff">🌸 SPRING MEADOW</text>
  </g>
</svg>
