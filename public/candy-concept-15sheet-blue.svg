<svg xmlns="http://www.w3.org/2000/svg" width="236mm" height="431mm" viewBox="0 0 236 431" font-family="'DM Sans', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="236" height="431" fill="#FFFFFF"/>
<rect x="0" y="0" width="136" height="431" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif">
  <rect x="3" y="3" width="130" height="190" fill="#FFFFFF"/>
  <line x1="19" y1="18" x2="117" y2="18" stroke="#0096cc" stroke-width="0.5"/>
  <text x="68" y="30" text-anchor="middle" font-size="6" font-weight="900" fill="#0096cc" letter-spacing="1.5">HOW TO USE</text>
  <line x1="19" y1="36" x2="117" y2="36" stroke="#0096cc" stroke-width="0.5"/>
  <g transform="translate(20,46)"><circle cx="6.5" cy="6.5" r="6.5" fill="none" stroke="#0096cc" stroke-width="0.6"/><text x="6.5" y="9" text-anchor="middle" font-size="5.6" font-weight="900" fill="#0096cc">1</text></g>
  <text x="33" y="49" font-size="4.6" font-weight="900" fill="#00334d">Drop</text>
  <text x="33" y="55" font-size="3.7" font-weight="600" fill="#005580">One sheet, straight into the empty drum</text>
  <g transform="translate(20,62)"><circle cx="6.5" cy="6.5" r="6.5" fill="none" stroke="#0096cc" stroke-width="0.6"/><text x="6.5" y="9" text-anchor="middle" font-size="5.6" font-weight="900" fill="#0096cc">2</text></g>
  <text x="33" y="65" font-size="4.6" font-weight="900" fill="#00334d">Load</text>
  <text x="33" y="71" font-size="3.7" font-weight="600" fill="#005580">Add your clothes on top</text>
  <g transform="translate(20,78)"><circle cx="6.5" cy="6.5" r="6.5" fill="none" stroke="#0096cc" stroke-width="0.6"/><text x="6.5" y="9" text-anchor="middle" font-size="5.6" font-weight="900" fill="#0096cc">3</text></g>
  <text x="33" y="81" font-size="4.6" font-weight="900" fill="#00334d">Wash</text>
  <text x="33" y="87" font-size="3.7" font-weight="600" fill="#005580">Any cycle. Hot or cold water</text>
  <text x="19" y="97" font-size="3.5" font-weight="600" fill="#80d0f0" font-style="italic">&#189; sheet everyday &#8226; 1 sheet heavy soil &#8226; 2 sheets stubborn stains</text>
  <line x1="19" y1="106" x2="117" y2="106" stroke="#c8eaff" stroke-width="1"/>
  <text x="68" y="118" text-anchor="middle" font-size="5" font-weight="900" fill="#0096cc" letter-spacing="1">WHAT'S INSIDE</text>
  <text x="27" y="127" font-size="3.9" font-weight="600" fill="#00334d">Plant-based surfactants</text>
  <text x="27" y="134" font-size="3.9" font-weight="600" fill="#00334d">Multi-enzyme cleaning blend</text>
  <text x="27" y="141" font-size="3.9" font-weight="600" fill="#00334d">Water-soluble, biodegradable sheet</text>
  <text x="27" y="148" font-size="3.9" font-weight="600" fill="#00334d">No sulphates &#183; no phosphates &#183; no dyes</text>
  <circle cx="21" cy="125.4" r="1.5" fill="#0096cc"/>
  <circle cx="21" cy="132.4" r="1.5" fill="#0096cc"/>
  <circle cx="21" cy="139.4" r="1.5" fill="#0096cc"/>
  <circle cx="21" cy="146.4" r="1.5" fill="#0096cc"/>
  <line x1="19" y1="156" x2="117" y2="156" stroke="#c8eaff" stroke-width="1"/>
  <text x="68" y="166" text-anchor="middle" font-size="5" font-weight="900" fill="#0096cc" letter-spacing="1">STORAGE</text>
  <text x="68" y="174" text-anchor="middle" font-size="3.8" font-weight="600" fill="#005580">Cool, dry place. Reseal after opening.</text>
</g>
<g>
  <rect x="3" y="193" width="130" height="190" fill="#0096cc"/>
  <rect x="10" y="200" width="116" height="176" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="34" y="211" width="68" height="26" fill="#FFFFFF" rx="4"/>
  <text x="68" y="228" text-anchor="middle" font-size="12" font-weight="900" fill="#0096cc" font-style="italic">eStrip</text>
  <text x="68" y="247" text-anchor="middle" font-size="3.6" font-family="Helvetica, Arial, sans-serif" fill="#FFFFFF" font-weight="900" letter-spacing="2.2">LAUNDRY DETERGENT SHEETS</text>
  <line x1="48" y1="253" x2="88" y2="253" stroke="#FFFFFF" stroke-width="1"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <rect x="46" y="265" width="36" height="25" rx="2" transform="rotate(-7 64 277)"/>
    <rect x="52" y="269" width="36" height="25" rx="2" transform="rotate(5 70 281)"/>
    <rect x="49" y="273" width="36" height="25" rx="2"/>
  </g>
  <text x="68" y="318" text-anchor="middle" font-size="16" font-weight="900" fill="#FFFFFF">15 Sheets</text>
  <text x="68" y="330" text-anchor="middle" font-size="7" font-weight="900" fill="#c8eaff">30 Washes</text>
  <text x="68" y="338" text-anchor="middle" font-size="3.3" font-family="Helvetica, Arial, sans-serif" fill="#FFFFFF" font-weight="600">Two washes per sheet</text>
  <line x1="48" y1="346" x2="88" y2="346" stroke="#FFFFFF" stroke-width="1"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#FFFFFF" font-weight="900">
    <text x="30" y="360" text-anchor="middle" font-size="3.1">PLANT-BASED</text>
    <text x="68" y="360" text-anchor="middle" font-size="3.1">ZERO PLASTIC</text>
    <text x="106" y="360" text-anchor="middle" font-size="3.1">HOT &amp; COLD</text>
  </g>
  <text x="68" y="371" text-anchor="middle" font-size="3.2" font-family="Helvetica, Arial, sans-serif" fill="#FFFFFF" font-weight="900" letter-spacing="0.8">WWW.ESTRIP.IN</text>
</g>
<g>
  <rect x="3" y="383" width="130" height="45" fill="#0096cc"/>
  <text x="68" y="420" text-anchor="middle" font-size="3.1" font-family="Helvetica, Arial, sans-serif" fill="#FFFFFF" font-weight="900" letter-spacing="1">ADHESIVE ZONE &#8226; TUCK TO SEAL</text>
</g>
<g>
  <rect x="0.3" y="0.3" width="135.4" height="430.4" fill="none" stroke="#EC008C" stroke-width="0.3" stroke-dasharray="1.5,1"/>
  <rect x="3" y="3" width="130" height="425" fill="none" stroke="#000000" stroke-width="0.4"/>
  <line x1="3" y1="193" x2="133" y2="193" stroke="#185FA5" stroke-width="0.4" stroke-dasharray="2,1.4"/>
  <line x1="3" y1="383" x2="133" y2="383" stroke="#185FA5" stroke-width="0.4" stroke-dasharray="2,1.4"/>
</g>
