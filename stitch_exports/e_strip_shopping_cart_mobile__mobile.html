<script>
        // Simple interactive demo logic
        document.querySelectorAll('.bouncy-hover').forEach(btn => {
            btn.addEventListener('click', function() {
                const span = this.parentElement.querySelector('span:not(.material-symbols-outlined)');
                let val = parseInt(span.innerText);
                if (this.querySelector('span').innerText === 'add') {
                    val++;
                } else if (val > 1) {
                    val--;
                }
                span.innerText = val;
            });
        });

        // Toggle sticky bar appearance on scroll
        window.addEventListener('scroll', () => {
            const footer = document.querySelector('.fixed.bottom-0');
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
                footer.classList.remove('shadow-[0_-12px_32px_rgba(224,64,160,0.15)]');
                footer.classList.add('border-t', 'border-outline-variant');
            } else {
                footer.classList.add('shadow-[0_-12px_32px_rgba(224,64,160,0.15)]');
                footer.classList.remove('border-t', 'border-outline-variant');
            }
        });
    </script>
